<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101014"><meta name="description" content="Semusika — temukan musik, simpan favorit, dan susun playlist-mu.">
  <link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"><title>Semusika — Your sound, your space</title>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#" data-view="home"><span class="brand-mark">s<span>♪</span></span><span>semusika<small>YOUR SOUND, YOUR SPACE</small></span></a>
    <div class="side-label">MENU</div>
    <nav class="side-nav">
      <button class="nav-item active" data-view="home"><span>⌂</span> Beranda</button>
      <button class="nav-item" data-view="search"><span>⌕</span> Cari musik</button>
      <button class="nav-item" data-view="library"><span>▤</span> Koleksi kamu</button>
    </nav>
    <div class="side-label playlist-label">KOLEKSI</div>
    <nav class="side-nav">
      <button class="nav-item" data-view="favorites"><span>♡</span> Lagu disukai</button>
      <button class="nav-item" data-view="recent"><span>◷</span> Baru diputar</button>
    </nav>
    <div class="sidebar-bottom"><div class="mini-note"><span class="pulse"></span><div><b>Semusika v0.1</b><small>Music discovery preview</small></div></div></div>
  </aside>
  <main class="main-area">
    <header class="topbar">
      <div class="mobile-brand"><span class="brand-mark">s<span>♪</span></span> semusika</div>
      <div class="history-controls"><button aria-label="Kembali" id="backBtn">‹</button><button aria-label="Maju" id="forwardBtn">›</button></div>
      <label class="top-search"><span>⌕</span><input id="globalSearch" placeholder="Cari lagu, artis, atau album..." autocomplete="off"><kbd>⌘ K</kbd></label>
      <button class="avatar" title="Semusika">S</button>
    </header>
    <section id="view" class="view-content" aria-live="polite"></section>
  </main>
</div>
<nav class="mobile-nav">
  <button class="active" data-view="home"><span>⌂</span>Home</button><button data-view="search"><span>⌕</span>Cari</button><button data-view="library"><span>▤</span>Koleksi</button><button data-view="favorites"><span>♡</span>Disukai</button>
</nav>
<div class="player" id="player">
  <div class="now-playing"><img id="playerArt" src="assets/cover.svg" alt=""><div class="track-meta"><b id="playerTitle">Pilih lagu untuk mulai</b><small id="playerArtist">Musik menunggumu</small></div><button id="likeCurrent" class="like-btn" aria-label="Sukai lagu">♡</button></div>
  <div class="player-center"><div class="player-controls"><button id="shuffleBtn" title="Acak">⤨</button><button id="prevBtn" title="Sebelumnya">◀|</button><button id="playBtn" class="play-btn" title="Putar">▶</button><button id="nextBtn" title="Berikutnya">|▶</button><button id="repeatBtn" title="Ulangi">↻</button></div><div class="progress-row"><span id="elapsed">0:00</span><input id="seekBar" type="range" min="0" max="100" value="0"><span id="duration">0:30</span></div></div>
  <div class="player-extra"><span class="source-label" id="sourceLabel">PREVIEW</span><button id="queueBtn" title="Antrean">☷</button><span>◖</span><input id="volumeBar" type="range" min="0" max="1" step=".01" value=".8"></div>
  <audio id="audio" preload="none"></audio>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body></html>
